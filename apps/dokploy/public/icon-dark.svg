<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meshDarkGrad" x1="91.5" y1="90" x2="420.5" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="nodeDarkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="darkGlow" x="50" y="25" width="412" height="462" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dock Foundation & Hexagon Frame -->
  <path d="M91.5 351 L256 446 L420.5 351" stroke="#475569" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M256 256 L256 446" stroke="#475569" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M91.5 161 L256 66 L420.5 161" stroke="#475569" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M256 66 L256 256" stroke="#475569" stroke-width="18" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.5"/>

  <!-- Main MESH Ribbon ('M' Network Architecture) -->
  <path d="M91.5 351 L91.5 161 L256 256 L420.5 161 L420.5 351" stroke="url(#meshDarkGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#darkGlow)"/>

  <!-- Topology Node Points -->
  <circle cx="256" cy="66" r="18" fill="#64748B"/>
  <circle cx="256" cy="446" r="18" fill="#64748B"/>

  <!-- Core Active Server Nodes -->
  <circle cx="91.5" cy="351" r="24" fill="url(#nodeDarkGrad)"/>
  <circle cx="91.5" cy="161" r="26" fill="url(#nodeDarkGrad)"/>
  <circle cx="256" cy="256" r="28" fill="#38BDF8"/>
  <circle cx="420.5" cy="161" r="26" fill="url(#nodeDarkGrad)"/>
  <circle cx="420.5" cy="351" r="24" fill="url(#nodeDarkGrad)"/>

  <!-- Hub Core Status Highlights -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
  <circle cx="91.5" cy="161" r="10" fill="#FFFFFF"/>
  <circle cx="420.5" cy="161" r="10" fill="#FFFFFF"/>
  <circle cx="91.5" cy="351" r="9" fill="#FFFFFF"/>
  <circle cx="420.5" cy="351" r="9" fill="#FFFFFF"/>
</svg>
