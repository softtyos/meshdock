<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="meshCenterGlow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#475569" fill-opacity="0.4"/>
    </pattern>
    <filter id="markGlow" x="0" y="0" width="300" height="300" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>
  <rect width="1200" height="630" fill="url(#meshCenterGlow)"/>

  <!-- Center Meshdock Mark Symbol (Scaled ~180x180 at offset 510, 80) -->
  <g transform="translate(510, 70) scale(0.35)" filter="url(#markGlow)">
    <!-- Base Dock Frame -->
    <path d="M91.5 351 L256 446 L420.5 351" stroke="#475569" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M256 256 L256 446" stroke="#475569" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M91.5 161 L256 66 L420.5 161" stroke="#475569" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M256 66 L256 256" stroke="#475569" stroke-width="18" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.5"/>

    <!-- Main MESH Ribbon ('M') -->
    <path d="M91.5 351 L91.5 161 L256 256 L420.5 161 L420.5 351" stroke="url(#brandGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Topology Node Points -->
    <circle cx="256" cy="66" r="18" fill="#64748B"/>
    <circle cx="256" cy="446" r="18" fill="#64748B"/>

    <!-- Core Active Server Nodes -->
    <circle cx="91.5" cy="351" r="24" fill="#38BDF8"/>
    <circle cx="91.5" cy="161" r="26" fill="#38BDF8"/>
    <circle cx="256" cy="256" r="28" fill="#38BDF8"/>
    <circle cx="420.5" cy="161" r="26" fill="#818CF8"/>
    <circle cx="420.5" cy="351" r="24" fill="#818CF8"/>

    <!-- Highlights -->
    <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
    <circle cx="91.5" cy="161" r="10" fill="#FFFFFF"/>
    <circle cx="420.5" cy="161" r="10" fill="#FFFFFF"/>
    <circle cx="91.5" cy="351" r="9" fill="#FFFFFF"/>
    <circle cx="420.5" cy="351" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Typography: Meshdock Wordmark -->
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" fill="#FFFFFF">
    Mesh<tspan fill="url(#textGrad)">dock</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#E2E8F0" letter-spacing="-0.5">
    Centralized Cloud Deployment &amp; Multi-Server Mesh Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    Unified multi-node control plane • Topology visualization • Real-time telemetry
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 480)">
    <!-- Pill 1: Multi-Server -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="#1E293B" stroke="#334155"/>
      <circle cx="18" cy="19" r="5" fill="#10B981"/>
      <text x="32" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Multi-Server</text>
    </g>

    <!-- Pill 2: Docker Swarm -->
    <g transform="translate(-155, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="#1E293B" stroke="#334155"/>
      <circle cx="18" cy="19" r="5" fill="#3B82F6"/>
      <text x="32" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Docker Swarm</text>
    </g>

    <!-- Pill 3: Mesh Topology -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="#1E293B" stroke="#334155"/>
      <circle cx="18" cy="19" r="5" fill="#06B6D4"/>
      <text x="32" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Mesh Topology</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="#1E293B" stroke="#334155"/>
      <circle cx="18" cy="19" r="5" fill="#8B5CF6"/>
      <text x="32" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Apache 2.0</text>
    </g>
  </g>

  <!-- Footer Brand -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B">
    Developed &amp; Maintained by SOFTTY.NET
  </text>
</svg>
