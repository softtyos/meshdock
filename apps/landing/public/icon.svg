<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meshdockGrad" x1="91.5" y1="90" x2="420.5" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="60" y="35" width="392" height="442" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dock Foundation & Geometric Hexagon Grid -->
  <path d="M91.5 351 L256 446 L420.5 351" stroke="#64748B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M256 256 L256 446" stroke="#64748B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M91.5 161 L256 66 L420.5 161" stroke="#64748B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M256 66 L256 256" stroke="#64748B" stroke-width="18" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.35"/>

  <!-- Main MESH Ribbon ('M' Network Architecture) -->
  <path d="M91.5 351 L91.5 161 L256 256 L420.5 161 L420.5 351" stroke="url(#meshdockGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Topology Node Points -->
  <circle cx="256" cy="66" r="18" fill="#94A3B8"/>
  <circle cx="256" cy="446" r="18" fill="#94A3B8"/>

  <!-- Core Active Server Nodes -->
  <circle cx="91.5" cy="351" r="24" fill="url(#nodeGrad)"/>
  <circle cx="91.5" cy="161" r="26" fill="url(#nodeGrad)"/>
  <circle cx="256" cy="256" r="28" fill="#3B82F6"/>
  <circle cx="420.5" cy="161" r="26" fill="url(#nodeGrad)"/>
  <circle cx="420.5" cy="351" r="24" fill="url(#nodeGrad)"/>

  <!-- Hub Core Status Highlights -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
  <circle cx="91.5" cy="161" r="10" fill="#FFFFFF"/>
  <circle cx="420.5" cy="161" r="10" fill="#FFFFFF"/>
  <circle cx="91.5" cy="351" r="9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="420.5" cy="351" r="9" fill="#FFFFFF" opacity="0.9"/>
</svg>
